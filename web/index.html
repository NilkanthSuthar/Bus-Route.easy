<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B8A5A" />
    <meta name="description" content="Find Vadodara city bus lines and stops near you." />
    <title>Bus Route.easy</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map" aria-label="Map of Vadodara bus lines"></div>

    <aside class="panel" id="panel" data-size="half">
      <button class="sheet-handle" id="sheet-handle" aria-label="Expand panel"></button>
      <header class="panel-top">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 4h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2l1 2h-2l-1-2H8l-1 2H5l1-2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 3v5h12V7H6Zm1.5 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>
          </span>
          Bus Route<span class="brand-dot">.easy</span>
        </a>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.4 4.4-1.4 1.4-4.4-4.4A6.5 6.5 0 1 1 10.5 4Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></svg>
          <input id="search" type="search" placeholder="Search stops or lines" autocomplete="off" spellcheck="false" />
        </label>
      </header>
      <main class="view" id="view" aria-live="polite"></main>
    </aside>

    <button class="fab" id="locate" aria-label="Show lines near me" title="Near me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8Zm0-6a1 1 0 0 1 1 1v1.06A8 8 0 0 1 19.94 11H21a1 1 0 1 1 0 2h-1.06A8 8 0 0 1 13 19.94V21a1 1 0 1 1-2 0v-1.06A8 8 0 0 1 4.06 13H3a1 1 0 1 1 0-2h1.06A8 8 0 0 1 11 4.06V3a1 1 0 0 1 1-1Zm0 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
    </button>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
